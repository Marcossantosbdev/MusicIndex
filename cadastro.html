<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="cadastro-card">
        <h1>Criar conta</h1>
        <p class="subtitle">Preencha os dados para cadastro</p>

        <div id="alerta" class="alert"></div>

        <form id="formCadastro" action="processacadastro.php" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" name="nome" id="nome" placeholder="João Pessoa">
                <span class="error-message" id="erro-nome"></span>
            </div>

            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" name="user-name" id="user-name" required placeholder="john Doe">
                <span class="error-message" id="erro-apelido"></span>
            </div>

            <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" required placeholder="johndoe@email.com">
                    <span class="error-message" id></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha">Senha *</label>
                    <input type="password" name="senha" id="senha" required placeholder="Crie uma senha forte">
                    <span class="error-message" id="erro-senha"></span>

                    <div class="strength-meter" id="strength-meter">
                        <div id="strength-meter-fill" class="strength-meter-fill"></div>
                    </div>

                    <div id="password-requirements" class="password-requirements">
                        <div class="requirement-item">
                            <span class="requirment-icon-invalid" id="icon-length">°</span>
                            <span class="requirement-text" id="text-length">Mínimo 8 caracteres</span>
                        </div>
                        
                        <div class="requirement-item">
                            <span class="requirment-icon-invalid" id="icon-length">°</span>
                            <span class="requirement-text" id="text-length">Mínimo 8 caracteres</span>
                        </div>

                        <div class="requirement-item">
                            <span class="requirment-icon-invalid" id="icon-length">°</span>
                            <span class="requirement-text" id="text-length">Mínimo 8 caracteres</span>
                        </div>

                        <div class="requirement-item">
                            <span class="requirment-icon-invalid" id="icon-length">°</span>
                            <span class="requirement-text" id="text-length">Mínimo 8 caracteres</span>
                        </div>

                        <div class="requirement-item">
                            <span class="requirment-icon-invalid" id="icon-length">°</span>
                            <span class="requirement-text" id="text-length">Mínimo 8 caracteres</span>
                        </div>

                    </div>
                </div>
            </div>

        </form>
    </main>
</body>
</html>
